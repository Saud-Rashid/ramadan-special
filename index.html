<!DOCTYPE html>
<html>
<head>
  <title>Bus Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const socket = io();
  const map = L.map('map').setView([23.8103, 90.4125], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markers = new Map();

  function updateMarker(busId, lat, lng) {
    if (markers.has(busId)) {
      markers.get(busId).setLatLng([lat, lng]);
    } else {
      const marker = L.marker([lat, lng]).addTo(map)
        .bindTooltip(busId, { permanent: true });
      markers.set(busId, marker);
    }
  }

  socket.on("initialLocations", (data) => {
    data.forEach(([busId, loc]) => {
      updateMarker(busId, loc.lat, loc.lng);
    });
  });

  socket.on("locationUpdate", ({ busId, lat, lng }) => {
    updateMarker(busId, lat, lng);
  });

  socket.on("busRemoved", (busId) => {
    if (markers.has(busId)) {
      map.removeLayer(markers.get(busId));
      markers.delete(busId);
    }
  });
</script>

</body>
</html>
